name: Check PR Description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check and label PR based on description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body ? pr.body.trim() : '';
            const label = 'do-not-merge/missing-description';

            // Helper: Add label if not already present
            async function addLabel() {
              const labels = pr.labels.map(l => l.name);
              if (!labels.includes(label)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [label],
                });
              }
            }

            // Helper: Remove label if present
            async function removeLabel() {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            // Validate PR body
            if (!body || body.length < 10) {
              core.setFailed('❌ Pull Request must have a meaningful description (at least 10 characters).');
              await addLabel();
            } else {
              console.log('✅ PR description looks good.');
              await removeLabel();
            }
